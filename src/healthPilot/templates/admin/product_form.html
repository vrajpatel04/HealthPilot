{% extends "base.html" %}
{% block title %}{% if product %}Edit{% else %}New{% endif %} Product — Admin{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-6 sm:p-8 shadow-sm">
  <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-6">{% if product %}Edit product{% else %}New product{% endif %}</h1>
  <form method="post" action="{% if product %}/admin/products/{{ product.id }}/edit{% else %}/admin/products/new{% endif %}" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Title</label>
      <input name="title" required value="{{ product.title if product else '' }}" class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Description</label>
      <textarea name="description" required rows="6" class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">{{ product.description if product else '' }}</textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Category</label>
      <select name="category" class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        {% for value, label in categories %}
        <option value="{{ value }}" {% if product and product.category.value == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Price (₹)</label>
      <input name="price" type="number" step="0.01" min="0" required value="{{ product.price if product else '' }}" class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-emerald-700 btn-press">Save</button>
      <a href="/admin/products" class="border border-slate-300 dark:border-slate-700 px-5 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 btn-press">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
