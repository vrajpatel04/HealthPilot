{% extends "base.html" %}
{% block title %}{% if product %}Edit{% else %}New{% endif %} Product — Admin{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl border p-8">
  <h1 class="text-2xl font-bold mb-6">{% if product %}Edit product{% else %}New product{% endif %}</h1>
  <form method="post" action="{% if product %}/admin/products/{{ product.id }}/edit{% else %}/admin/products/new{% endif %}" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Title</label>
      <input name="title" required value="{{ product.title if product else '' }}" class="w-full border rounded-lg px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Description</label>
      <textarea name="description" required rows="6" class="w-full border rounded-lg px-3 py-2">{{ product.description if product else '' }}</textarea>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Category</label>
      <select name="category" class="w-full border rounded-lg px-3 py-2">
        {% for value, label in categories %}
        <option value="{{ value }}" {% if product and product.category.value == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Price (₹)</label>
      <input name="price" type="number" step="0.01" min="0" required value="{{ product.price if product else '' }}" class="w-full border rounded-lg px-3 py-2">
    </div>
    <div class="flex gap-3">
      <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">Save</button>
      <a href="/admin/products" class="border px-4 py-2 rounded-lg text-slate-600">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
