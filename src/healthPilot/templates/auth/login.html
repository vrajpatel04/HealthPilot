{% extends "base.html" %}
{% block title %}Login — HealthPilot{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-6 sm:p-8 shadow-sm">
  <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 mb-6">Log in</h1>
  {% if error %}<p class="text-red-600 dark:text-red-400 text-sm mb-4">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
      <input type="email" name="email" required class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
      <input type="password" name="password" required class="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>
    <button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-medium hover:bg-emerald-700 btn-press">Log in</button>
  </form>
  <p class="text-sm text-slate-500 dark:text-slate-400 mt-4">No account? <a href="/register" class="text-emerald-700 dark:text-emerald-400 hover:underline">Sign up</a></p>
</div>
{% endblock %}
