{% extends "base.html" %}
{% block title %}Login — HealthPilot{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl border p-8">
  <h1 class="text-2xl font-bold mb-6">Log in</h1>
  {% if error %}<p class="text-red-600 text-sm mb-4">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" name="email" required class="w-full border rounded-lg px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" name="password" required class="w-full border rounded-lg px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium">Log in</button>
  </form>
  <p class="text-sm text-slate-500 mt-4">No account? <a href="/register" class="text-emerald-700 hover:underline">Sign up</a></p>
</div>
{% endblock %}
