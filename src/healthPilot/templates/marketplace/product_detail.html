{% extends "base.html" %}
{% block title %}{{ product.title }} — HealthPilot{% endblock %}
{% block content %}
<article class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-6 sm:p-8 max-w-3xl shadow-sm">
  <span class="text-xs uppercase tracking-wide font-medium text-emerald-700 dark:text-emerald-400">{{ category_labels[product.category] }}</span>
  <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-slate-100 mt-2">{{ product.title }}</h1>
  <p class="text-xl sm:text-2xl font-semibold text-slate-900 dark:text-slate-100 mt-4">₹{{ product.price }}</p>
  <div id="product-description" class="mt-6 prose prose-slate dark:prose-invert max-w-none text-slate-700 dark:text-slate-300 leading-relaxed">
    {{ product.description }}
  </div>
  <a href="/products" class="inline-block mt-8 text-emerald-700 dark:text-emerald-400 hover:underline font-medium btn-press">← Back to marketplace</a>
</article>
{% endblock %}
