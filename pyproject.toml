[project]
name = "HealthPilot"
version = "0.1.0"
description = "An Agentic AI Lifestyle Recommendation System Powered by Behavioral Intelligence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "author_name", email = "author_email@gmail.com" }
]
keywords = ["wellness", "recommendation", "health", "personalized", "fastapi", "langchain"]
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthpilot"]