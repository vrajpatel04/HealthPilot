[project]
name = "HealthPilot"
version = "0.1.0"
description = "An Agentic AI Lifestyle Recommendation System Powered by Behavioral Intelligence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "author_name", email = "author_email@gmail.com" }
]
keywords = ["wellness", "recommendation", "health", "personalized", "fastapi", "langchain"]
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "nemoguardrails>=0.16.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "spacy>=3.7.0",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "uvicorn>=0.52.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/healthPilot"]

[tool.hatch.build.targets.wheel.force-include]
"src/healthPilot/privacy/nemo_config" = "healthPilot/privacy/nemo_config"
